[project]
name = "corewatch"
version = "0.1.0"
description = "A Core Temp-style hardware monitor for Linux: temperatures, fans, voltages, clocks and power in real time."
authors = [
    { name = "Ronaldo Campos", email = "ronaldo.romanello@gmail.com" }
]
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "nvidia-ml-py>=13.615.71",
    "pyside6>=6.11.2",
    "textual>=8.2.8",
]

[project.scripts]
corewatch = "corewatch:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-qt>=4.5.0",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
qt_api = "pyside6"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
allowed-confusables = ["−"]  # typographic minus in chart labels

[tool.mypy]
strict = true
files = ["src"]
