name: Release

on:
  # A version tag (v0.1.0) builds the .deb and .rpm and attaches them to that tag's release.
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same lint, types and tests as every push: a tag on a commit that fails them publishes nothing.
  checks:
    uses: ./.github/workflows/ci.yml

  packages:
    name: Packages (${{ matrix.runner }})
    needs: checks
    strategy:
      matrix:
        # The oldest Ubuntu the .deb is for: its Depends names the libraries as this release
        # packages them (the t64 names), which later releases keep. The .rpm names them by
        # soname, so where it's built doesn't matter. Each builds its own architecture.
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # the build runs code from PyPI; it gets no token to push with

      # setup-uv publishes only exact versions (no floating v10 tag), so pin one. uv itself is
      # pinned too, inside pyproject's uv_build range, so the build backend isn't fetched from PyPI
      # and a release builds the same way each time.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.8"

      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi

      # The builds check every bundled library finds what it links to, and the .deb names the
      # packages that hold them in Depends, so the system libraries Qt uses must be installed here
      # (on arm64 its X11 plugin also links libSM and libICE).
      - name: System libraries Qt links to, and rpmbuild
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm \
            libegl1 libgl1 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 libgtk-3-0t64 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libgssapi-krb5-2 libsm6 libice6

      - name: Build
        run: |
          packaging/deb/build.sh dist
          packaging/rpm/build.sh dist

      - uses: actions/upload-artifact@v7
        with:
          name: packages-${{ matrix.runner }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

  # One job attaches every architecture's packages, so the builds can't race to create the release,
  # and the token that can write to it never sits beside code from PyPI.
  release:
    name: Release
    needs: packages
    permissions:
      contents: write  # to create the release and upload to it
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb dist/*.rpm --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # The apt repository on GitHub Pages (https://ronaldorcampos.github.io/corewatch), holding this
  # release's .debs and nothing older. Pre-releases (v0.2.0rc1: the only tags with letters) stay
  # off it, so nobody's apt upgrade picks one up.
  apt:
    name: Apt repository
    needs: release
    if: ${{ !contains(github.ref_name, 'a') && !contains(github.ref_name, 'b') && !contains(github.ref_name, 'rc') }}
    permissions:
      pages: write  # to deploy the site
      id-token: write  # which deploy-pages proves its identity with
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true

      - name: Build and sign the repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get install -y --no-install-recommends apt-utils
          printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
          packaging/deb/apt-repo.sh dist site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
