name: Release

on:
  # A version tag (v0.1.0) builds the .deb and attaches it to that tag's release.
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # The same lint, types and tests as every push: a tag on a commit that fails them publishes nothing.
  checks:
    uses: ./.github/workflows/ci.yml

  deb:
    name: Debian package
    needs: checks
    permissions:
      contents: write  # to create the release and upload to it
    # The oldest Ubuntu the package is for: its Depends names the libraries as this release
    # packages them (the t64 names), which later releases keep.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false  # the build runs code from PyPI; it gets no token to push with

      # setup-uv publishes only exact versions (no floating v10 tag), so pin one. uv itself is
      # pinned too, inside pyproject's uv_build range, so the build backend isn't fetched from PyPI
      # and a release builds the same way each time.
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.11.8"

      - name: The tag matches the version in pyproject.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match version $version in pyproject.toml" >&2
            exit 1
          fi

      # The build checks every bundled library finds what it links to, and names the packages
      # that hold them in Depends, so the system libraries Qt uses must be installed here.
      - name: System libraries Qt links to
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libfreetype6 libdbus-1-3 libglib2.0-0t64 libgtk-3-0t64 \
            libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xkb1 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 libgssapi-krb5-2

      - name: Build
        run: packaging/deb/build.sh dist

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.deb --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.deb --title "$GITHUB_REF_NAME" --generate-notes
          fi
